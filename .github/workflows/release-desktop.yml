name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-updater matches app.getVersion() against the version in latest.yml.
      # If the git tag and apps/desktop/package.json disagree, installed apps either
      # never see the update or loop on a version they cannot reach.
      - name: Verify tag matches desktop package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "tag='$TAG' package.json version='$PKG_VERSION'"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match apps/desktop/package.json version 'v$PKG_VERSION'."
            echo "Bump the version in apps/desktop/package.json to ${TAG#v} and re-tag."
            exit 1
          fi

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Build React web application
        run: npm run build

      - name: Check desktop app code
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Generate dual installer aliases (both Bob-Research-Companion-Setup.exe and Bob-Research-Companion-Setup-version.exe)
        working-directory: apps/desktop
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Processing installer aliases for version: $VERSION"
          if [ -f "dist/Bob-Research-Companion-Setup.exe" ]; then
            cp "dist/Bob-Research-Companion-Setup.exe" "dist/Bob-Research-Companion-Setup-${VERSION}.exe"
            [ -f "dist/Bob-Research-Companion-Setup.exe.blockmap" ] && cp "dist/Bob-Research-Companion-Setup.exe.blockmap" "dist/Bob-Research-Companion-Setup-${VERSION}.exe.blockmap"
            echo "Created dist/Bob-Research-Companion-Setup-${VERSION}.exe from canonical setup"
          elif [ -f "dist/Bob-Research-Companion-Setup-${VERSION}.exe" ]; then
            cp "dist/Bob-Research-Companion-Setup-${VERSION}.exe" "dist/Bob-Research-Companion-Setup.exe"
            [ -f "dist/Bob-Research-Companion-Setup-${VERSION}.exe.blockmap" ] && cp "dist/Bob-Research-Companion-Setup-${VERSION}.exe.blockmap" "dist/Bob-Research-Companion-Setup.exe.blockmap"
            echo "Created dist/Bob-Research-Companion-Setup.exe from versioned setup"
          fi
          ls -la dist/

      # Safety net so the release always carries the full asset set.
      # The .blockmap is required for differential downloads; without it
      # electron-updater falls back to a full 118 MB download.
      - name: Attach installer and update metadata to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
            public/bob-chrome-extension.zip
