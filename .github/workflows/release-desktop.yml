name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check desktop app code
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check renderer/app.js

      # The desktop app is self-contained; the website (Next.js) is deployed
      # separately on Vercel and is NOT built or bundled here.
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --publish never

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*.exe
