name: Bob Quality Checks
# Release marker: v1.0.74 validated desktop and extension artifacts
# v1.0.74 final validation after updater-download wiring

on:
  push:
    branches:
      - fix/adaptive-roadmap-home-chat-v1.0.72
      - fix/bob-experience-polish-v1.0.73
      - feat/adaptive-bob-pathway-profile-updates-v1.0.74
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (retry transient native binary downloads)
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for attempt in 1 2 3; do
            npm install --legacy-peer-deps && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency installation failed on attempt $attempt; retrying after a short delay..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Test companion workspace tools
        run: npm run test:companion-tools

      - name: TypeScript validation
        run: npm run lint

      - name: Build web app and package extension
        run: npm run build

      - name: Check extension JavaScript syntax
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/content.js
          node --check chrome-extension/sidepanel.js

      - name: Verify release versions
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$ROOT_VERSION" != "$DESKTOP_VERSION" ]; then
            echo "::error::Root version $ROOT_VERSION does not match desktop version $DESKTOP_VERSION"
            exit 1
          fi
          echo "Bob release version: $ROOT_VERSION"
          node -e "const m=require('./chrome-extension/manifest.json'); if (!/^\d+\.\d+\.\d+$/.test(m.version)) process.exit(1); console.log('Chrome extension version:', m.version)"

      - name: Upload built app and extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: bob-quality-build
          path: |
            dist/
            public/bob-chrome-extension.zip
          if-no-files-found: error
          retention-days: 7

  publish_desktop_release:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release-bob-v1.0.71') || startsWith(github.event.head_commit.message, 'release-bob-v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies (retry transient native binary downloads)
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm install --legacy-peer-deps
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          exit 1

      - name: TypeScript validation
        run: npm run lint

      - name: Build web app and extension
        run: npm run build

      - name: Verify release version and extension scripts
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test "$ROOT_VERSION" = "$DESKTOP_VERSION"
          test "$DESKTOP_VERSION" = "$ROOT_VERSION"
          node --check chrome-extension/background.js
          node --check chrome-extension/content.js
          node --check chrome-extension/sidepanel.js
          node --check apps/desktop/main.cjs
          node --check apps/desktop/preload.cjs

      - name: Install desktop dependencies (retry transient native binary downloads)
        working-directory: apps/desktop
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          exit 1

      - name: Build and publish Windows installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Add versioned installer alias
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ -f "apps/desktop/dist/Bob-Research-Companion-Setup.exe" ]; then
            cp "apps/desktop/dist/Bob-Research-Companion-Setup.exe" "apps/desktop/dist/Bob-Research-Companion-Setup-${ROOT_VERSION}.exe"
            if [ -f "apps/desktop/dist/Bob-Research-Companion-Setup.exe.blockmap" ]; then
              cp "apps/desktop/dist/Bob-Research-Companion-Setup.exe.blockmap" "apps/desktop/dist/Bob-Research-Companion-Setup-${ROOT_VERSION}.exe.blockmap"
            fi
          fi

      - name: Resolve release version from package.json
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Publish Bob release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bob ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
            public/bob-chrome-extension.zip
