name: Bob Quality Checks
# v1.0.74 adaptive roadmap/profile/update UI validation

on:
  push:
    branches:
      - fix/adaptive-roadmap-home-chat-v1.0.72
      - fix/bob-experience-polish-v1.0.73
      - feat/adaptive-bob-pathway-profile-updates-v1.0.74
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Build web app and package extension
        run: npm run build

      - name: Check extension JavaScript syntax
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/content.js
          node --check chrome-extension/sidepanel.js

      - name: Verify release versions
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$ROOT_VERSION" != "$DESKTOP_VERSION" ]; then
            echo "::error::Root version $ROOT_VERSION does not match desktop version $DESKTOP_VERSION"
            exit 1
          fi
          echo "Bob release version: $ROOT_VERSION"
          node -e "const m=require('./chrome-extension/manifest.json'); if (!/^\d+\.\d+\.\d+$/.test(m.version)) process.exit(1); console.log('Chrome extension version:', m.version)"

      - name: Upload built app and extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: bob-quality-build
          path: |
            dist/
            public/bob-chrome-extension.zip
          if-no-files-found: error
          retention-days: 7

  publish_desktop_release:
    needs: validate
    if: startsWith(github.event.head_commit.message, 'release-bob-v1.0.71') || startsWith(github.event.head_commit.message, 'release-bob-v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Build web app and extension
        run: npm run build

      - name: Verify release version and extension scripts
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test "$ROOT_VERSION" = "1.0.74"
          test "$DESKTOP_VERSION" = "$ROOT_VERSION"
          node --check chrome-extension/background.js
          node --check chrome-extension/content.js
          node --check chrome-extension/sidepanel.js
          node --check apps/desktop/main.cjs
          node --check apps/desktop/preload.cjs

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build and publish Windows installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Add versioned installer alias
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ -f "apps/desktop/dist/Bob-Research-Companion-Setup.exe" ]; then
            cp "apps/desktop/dist/Bob-Research-Companion-Setup.exe" "apps/desktop/dist/Bob-Research-Companion-Setup-${ROOT_VERSION}.exe"
            if [ -f "apps/desktop/dist/Bob-Research-Companion-Setup.exe.blockmap" ]; then
              cp "apps/desktop/dist/Bob-Research-Companion-Setup.exe.blockmap" "apps/desktop/dist/Bob-Research-Companion-Setup-${ROOT_VERSION}.exe.blockmap"
            fi
          fi

      - name: Publish Bob release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.74
          target_commitish: ${{ github.sha }}
          name: Bob v1.0.74
          draft: false
          prerelease: false
          make_latest: true
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
            public/bob-chrome-extension.zip
